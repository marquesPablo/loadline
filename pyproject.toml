[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "loadline"
version = "0.1.0"
description = "Reads the agent folder you already have and finds what only shows up from the third one on: who gets confused with whom, who reaches the whole disk, what nobody covers."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
keywords = [
    "agents",
    "agent-spec",
    "subagents",
    "claude-code",
    "agents-md",
    "agent-governance",
    "linter",
    "documentation-drift",
    "verification",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Documentation",
    "Topic :: Software Development :: Quality Assurance",
]

# ⚠️ EMPTY ON PURPOSE, and the emptiness is the feature.
#
# A verifier that depends on a model is not a verifier — it is a second opinion.
# A verifier that depends on a service does not run in the CI of whoever needs it
# most. Only the stdlib.
#
# This list is measured by the `nucleo.dependencias` probe, and the README
# asserts it. Adding a line here fails the README until someone rewrites the
# sentence — which is exactly the behavior this project sells.
dependencies = []

[project.scripts]
forja = "forja.__main__:main"
loadline = "loadline.__main__:main"

[project.urls]
Repository = "https://github.com/marquesPablo/loadline"

[tool.hatch.build.targets.wheel]
packages = ["loadline", "forja", "censo", "vitrine", "blind", "placar", "evidencia"]

[tool.hatch.build.targets.sdist]
include = [
    "/loadline",
    "/forja",
    "/censo",
    "/vitrine",
    "/blind",
    "/placar",
    "/evidencia",
    "/operacoes",
    "/exemplos",
    "/acao",
    "/vendorizado",
    "/sondas.py",
    "/autoteste.py",
    "/vendorizar.py",
    "/action.yml",
    "/README.md",
    "/LACUNAS.md",
    "/LICENSE",
]
