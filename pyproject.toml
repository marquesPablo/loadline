[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aferido"
version = "0.1.0"
description = "Toda afirmação escrita vence — e este pacote faz ela dizer quando, e como se recomputa."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
keywords = [
    "documentation-drift",
    "assertion-decay",
    "verification",
    "agents",
    "agent-spec",
    "governance",
    "provenance",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Documentation",
    "Topic :: Software Development :: Quality Assurance",
]

# ⚠️ VAZIO DE PROPÓSITO, e o vazio é a característica.
#
# Um verificador que depende de um modelo não é um verificador — é uma segunda
# opinião. Um verificador que depende de um serviço não roda no CI de quem mais
# precisa dele. Só a stdlib.
#
# Esta lista é medida pela sonda `nucleo.dependencias`, e o README a afirma.
# Acrescentar uma linha aqui reprova o README até alguém reescrever a frase —
# que é exatamente o comportamento que este projeto vende.
dependencies = []

[project.scripts]
aferido = "aferido.__main__:main"

[project.urls]
Repository = "https://github.com/USUARIO/aferido"

[tool.hatch.build.targets.wheel]
packages = ["aferido"]

[tool.hatch.build.targets.sdist]
include = [
    "/aferido",
    "/forja",
    "/censo",
    "/sondas.py",
    "/autoteste.py",
    "/README.md",
    "/LACUNAS.md",
    "/LICENSE",
]
