# Copy to `.github/workflows/your-operation-name.yml`.
#
# TODO — if your probe measures something that only gets worse with INACTION
# (the way `sala-de-decisao` measures a stalled queue), consider a daily
# `schedule` instead of just `pull_request` — an item that does not change
# fires no event, and with no cron it stays invisible until someone needs it.

name: your-operation-name

on:
  pull_request:
    paths:
      - "TODO/**"
  workflow_dispatch:

jobs:
  aferir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: install loadline
        run: |
          git clone --depth 1 https://github.com/marquesPablo/loadline.git /tmp/loadline
          echo "PYTHONPATH=/tmp/loadline" >> "$GITHUB_ENV"

      - name: check
        run: |
          set +e
          python -m loadline . | tee relatorio.txt
          codigo=${PIPESTATUS[0]}
          set -e
          case "$codigo" in
            0) echo "intact: every seal matches the probe" ;;
            1)
              echo "::error::divergence between what is written and what the probe measured just now"
              echo "::notice::relation diverging = STOP and investigate. count = read the number, then re-seal."
              exit 1
              ;;
            2)
              echo "::error::no seal covers this operation's metric. Read comunidade/your-operation-name/selos.md"
              exit 1
              ;;
            *) echo "::error::loadline could not run"; exit 1 ;;
          esac

# TODO — re-read LACUNAS.md before deciding whether this job FAILS (exit 1) or
# only WARNS (::warning::, no exit). A heuristic metric (wrong both ways) should
# never fail on its own — it trains whoever uses it to write code to please the
# ruler, not to fix the real problem.
