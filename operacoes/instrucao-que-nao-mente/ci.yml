# Copy to `.github/workflows/instrucao.yml`.
#
# The point of this job is not to be green. It is to tell THREE states apart
# that almost every CI flattens into two — and the third is the one that
# decides whether a green means anything:
#
#   0  everything checked and within the deadline
#   1  FAIL           — something checked does not match
#   2  NO DENOMINATOR — nothing fails, and there is a claim nobody verifies
#
# A repository that never annotated anything returns 2, not 0. Treating the two
# as the same thing is `not measured` turning into `zero`, which is exactly the
# defect this tool exists to forbid.

name: instrucao-que-nao-mente

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    # `expires=` only bites if someone runs. Without this line, an expired seal
    # waits for the next commit — and the most idle repository is exactly the
    # one with the most stale documentation.
    - cron: "0 6 * * 1"

jobs:
  aferir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"   # `tomllib` is stdlib from here on

      - name: install loadline
        run: |
          git clone --depth 1 https://github.com/marquesPablo/loadline.git /tmp/loadline
          echo "PYTHONPATH=/tmp/loadline" >> "$GITHUB_ENV"

      - name: check what the instruction files promise
        id: aferir
        continue-on-error: true
        run: python -m loadline .

      - name: decide
        run: |
          case "${{ steps.aferir.outcome }}" in
            success) echo "everything checked and within the deadline" ;;
            *)
              python -m loadline . || codigo=$?
              case "${codigo:-0}" in
                1) echo "::error::something written no longer matches the repository"; exit 1 ;;
                2) echo "::warning::there is a claim no seal covers — run \`python -m loadline . --selar\`"; exit 0 ;;
                *) echo "::error::loadline could not run"; exit 1 ;;
              esac
              ;;
          esac

# ⚠️ The `exit 0` line in the `2` case is a CHOICE, and it has an owner: the
#    adopter. Letting `NO DENOMINATOR` pass in CI is reasonable in the first
#    week and is debt from the second. When the team is ready, swap it for
#    `exit 1` — and seal the decision. The seal ready to copy is in `selos.md`,
#    in the «The minimum» section, with the `by=` and the `breaks=` it requires.
