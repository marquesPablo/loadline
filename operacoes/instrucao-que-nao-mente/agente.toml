# Operação 1 — o agente que abre a quebra que a sonda só contou.
#
# A sonda devolve `instrucao.comandos_quebrados=2`. Este agente devolve QUAIS,
# e o conserto de cada um. São trabalhos diferentes: a sonda é o gate, o agente
# é o diagnóstico. Um número sem o diagnóstico vira alarme que alguém desliga.
#
# Compile com:  python -m forja operacoes/instrucao-que-nao-mente/agente.toml

[agente]
slug = "guardiao-de-instrucao"
nome = "Guardião de instrução"
uma_frase = """
Lê os arquivos de instrução de agente do repositório — `AGENTS.md`, `CLAUDE.md`, `.cursorrules` e \
os irmãos — e devolve, com arquivo e linha, todo comando que ele manda rodar e não existe mais, \
todo caminho que ele manda editar e foi deletado, e todo trecho que existe num dos arquivos e \
não no outro.\
"""
usar_quando = [
  "o repositório tem AGENTS.md e CLAUDE.md e você não sabe se os dois ainda dizem a mesma coisa",
  "um agente falhou seguindo a instrução e você quer saber se a instrução é que está velha",
  "antes de aceitar um PR que muda script de build, para ver o que a instrução prometia sobre ele",
  "a sonda `instrucao.comandos_quebrados` saiu de zero e você precisa saber quais",
]
nunca_usar = [
  "reescrever o arquivo de instrução — ele acusa e nunca conserta; o conserto é decisão de quem é dono do repositório",
  "julgar se a instrução é BOA; ele responde se ela ainda é verdadeira, que é outra pergunta",
  "revisar código em busca de bug ou de vulnerabilidade — nada aqui olha para a lógica do programa",
  "auditar a fronteira dos subagentes (quem escreve onde, quem fala com quem) — isso é a vistoria de roster da `forja` (`python -m forja`)",
  "decidir qual harness o time deve usar — ele lê os arquivos que existem, não recomenda ferramenta",
]

[fronteira]
ferramentas = ["Read", "Grep", "Glob"]
toca_alvo = false

[prova]
lacunas = [
  "só enxerga o que está ESCRITO: se ninguém cita um comando no arquivo de instrução, ele não descobre que o comando existia e sumiu",
  "só lê comando dentro de cerca de código; comando citado em prosa pode ser exemplo ou contraexemplo, e ele não distingue os dois",
  "não resolve alias de shell, variável de ambiente nem script que chama script — `npm run ci` existindo não prova que o que ele chama existe",
  "não sabe se o caminho citado foi RENOMEADO ou DELETADO; ele sabe que não está lá, e as duas exigem consertos diferentes",
  "não lê monorepo por workspace: um `package.json` de pacote interno não é consultado se o comando não disser em qual pasta rodar",
  "não julga divergência SEMÂNTICA entre dois arquivos de instrução — dois títulos iguais com regras contrárias passam sem acusação",
]

[[prova.golden]]
pergunta = "O AGENTS.md manda rodar `npm run test:unit` e o `package.json` só declara `build` e `test`. O que o agente responde?"
esperado = """
Que o comando está quebrado, citando as duas linhas: a do `AGENTS.md` onde ele é mandado rodar, e a \
do `package.json` onde os scripts existentes estão declarados. E que o conserto é de UM dos dois \
lados — renomear no arquivo de instrução, ou recriar o script — nunca dos dois, e ele não escolhe qual.\
"""
derivado_de = "operacoes/instrucao-que-nao-mente/sondas.py:_instr_quebrado — o ramo `npm`/`pnpm`/`yarn`/`bun`"

[[prova.golden]]
pergunta = "O AGENTS.md manda rodar `make lint` e o repositório não tem Makefile nenhum. O agente acusa?"
esperado = """
Não acusa como quebra, e diz por quê: sem `Makefile` no repositório não há como PROVAR que o alvo \
não existe — o comando pode vir de um `make` instalado globalmente ou de outra pasta. Ele reporta \
como indecidível, com o motivo, em vez de contar como defeito. Errar para o lado de calar é decisão \
declarada: uma sonda que grita lobo é apagada na segunda semana.\
"""
derivado_de = "operacoes/instrucao-que-nao-mente/sondas.py:_instr_quebrado — o `return False` quando `alvos` vem vazio"

[[prova.golden]]
pergunta = "`AGENTS.md` tem os títulos «Instruções» e «Como rodar»; `CLAUDE.md` tem esses dois mais «Convenções de commit». Qual a divergência?"
esperado = """
Uma. A união dos títulos tem três e a interseção tem dois; o que sobra é «Convenções de commit», \
presente só no `CLAUDE.md`. O agente nomeia o título e o arquivo em que ele falta — e diz que a \
medida é de PRESENÇA, não de conteúdo: dois títulos iguais com regras contrárias não seriam acusados.\
"""
derivado_de = "operacoes/instrucao-que-nao-mente/sondas.py:divergencia_entre_arquivos — união menos interseção"

[[prova.golden]]
pergunta = "Existe um arquivo de instrução com 400 linhas e nenhum número dentro. O agente reprova?"
esperado = """
Não. Tamanho não é defeito por esta régua, e `instrucao.linhas` é de natureza `contagem` — ela anda \
quando alguém escreve, e divergir ali é normal. O que reprovaria seria um selo dizendo 180 linhas \
quando a sonda mede 400, ou um `vence=` estourado. O agente diz isso explicitamente em vez de \
inventar um limite de tamanho que ninguém escolheu.\
"""
derivado_de = "README.md § `DERIVOU` sozinho não diz nada — a definição de `natureza=contagem`"
