# Operation 1 — the agent that opens the break the probe only counted.
#
# The probe returns `instrucao.comandos_quebrados=2`. This agent returns WHICH,
# and the fix for each. They are different jobs: the probe is the gate, the
# agent is the diagnosis. A number with no diagnosis becomes an alarm someone
# switches off.
#
# (The TOML keys below are still Portuguese — translating the spec schema is its
#  own step.)
#
# Compile with:  python -m forja operacoes/instrucao-que-nao-mente/agente.toml

[agente]
slug = "guardiao-de-instrucao"
nome = "Instruction guardian"
uma_frase = """
Reads the repository's agent instruction files — `AGENTS.md`, `CLAUDE.md`, `.cursorrules` and their \
siblings — and returns, with file and line, every command it tells you to run and that no longer \
exists, every path it tells you to edit and that was deleted, and every passage that exists in one \
file and not the other.\
"""
usar_quando = [
  "the repository has AGENTS.md and CLAUDE.md and you do not know whether the two still say the same thing",
  "an agent failed following the instruction and you want to know whether the instruction is the stale one",
  "before accepting a PR that changes a build script, to see what the instruction promised about it",
  "the `instrucao.comandos_quebrados` probe left zero and you need to know which ones",
]
nunca_usar = [
  "rewriting the instruction file — it accuses and never fixes; the fix is a decision for whoever owns the repository",
  "judging whether the instruction is GOOD; it answers whether it is still true, which is another question",
  "reviewing code for a bug or a vulnerability — nothing here looks at the program's logic",
  "auditing the subagents' boundary (who writes where, who talks to whom) — that is the `forja` roster survey (`python -m forja`)",
  "deciding which harness the team should use — it reads the files that exist, it does not recommend a tool",
]

[fronteira]
ferramentas = ["Read", "Grep", "Glob"]
toca_alvo = false

[prova]
lacunas = [
  "it only sees what is WRITTEN: if nobody cites a command in the instruction file, it does not find that the command existed and disappeared",
  "it only reads a command inside a code fence; a command cited in prose can be an example or a counter-example, and it does not tell the two apart",
  "it does not resolve a shell alias, an environment variable or a script that calls a script — `npm run ci` existing does not prove that what it calls exists",
  "it does not know whether the cited path was RENAMED or DELETED; it knows it is not there, and the two need different fixes",
  "it does not read a monorepo by workspace: an internal package's `package.json` is not consulted if the command does not say which folder to run in",
  "it does not judge a SEMANTIC divergence between two instruction files — two identical headings with opposite rules pass with no accusation",
]

[[prova.golden]]
pergunta = "AGENTS.md tells you to run `npm run test:unit` and `package.json` only declares `build` and `test`. What does the agent answer?"
esperado = """
That the command is broken, citing the two lines: the one in `AGENTS.md` where it is told to run, \
and the one in `package.json` where the existing scripts are declared. And that the fix is on ONE \
of the two sides — rename it in the instruction file, or recreate the script — never both, and it \
does not choose which.\
"""
derivado_de = "operacoes/instrucao-que-nao-mente/sondas.py:_instr_quebrado — the `npm`/`pnpm`/`yarn`/`bun` branch"

[[prova.golden]]
pergunta = "AGENTS.md tells you to run `make lint` and the repository has no Makefile at all. Does the agent accuse?"
esperado = """
It does not accuse it as a break, and says why: with no `Makefile` in the repository there is no \
way to PROVE the target does not exist — the command could come from a globally installed `make` or \
from another folder. It reports it as undecidable, with the reason, instead of counting it as a \
defect. Erring on the side of going quiet is a declared decision: a probe that cries wolf is \
deleted in the second week.\
"""
derivado_de = "operacoes/instrucao-que-nao-mente/sondas.py:_instr_quebrado — the `return False` when `alvos` comes back empty"

[[prova.golden]]
pergunta = "`AGENTS.md` has the headings «Instruções» and «Como rodar»; `CLAUDE.md` has those two plus «Convenções de commit». What is the divergence?"
esperado = """
One. The union of headings has three and the intersection has two; what is left is «Convenções de \
commit», present only in `CLAUDE.md`. The agent names the heading and the file it is missing from — \
and says the measure is of PRESENCE, not content: two identical headings with opposite rules would \
not be accused.\
"""
derivado_de = "operacoes/instrucao-que-nao-mente/sondas.py:divergencia_entre_arquivos — union minus intersection"

[[prova.golden]]
pergunta = "There is an instruction file with 400 lines and no number inside. Does the agent fail it?"
esperado = """
No. Size is not a defect by this rule, and `instrucao.linhas` is of nature `count` — it moves when \
someone writes, and diverging there is normal. What would fail is a seal saying 180 lines when the \
probe measures 400, or a blown `expires=`. The agent says so explicitly instead of inventing a size \
limit nobody chose.\
"""
derivado_de = "README.md § `DRIFTED` alone says nothing — the definition of `nature=count`"
