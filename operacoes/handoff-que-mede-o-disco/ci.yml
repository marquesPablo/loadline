# Copy to `.github/workflows/handoff.yml`.
#
# ⚠️ READ BEFORE TURNING ON, BECAUSE HALF THIS OPERATION'S PROBES DO NOT HOLD HERE.
#
# `handoff.commits_desde` and `handoff.sessoes_desde` read `mtime`, and git does
# NOT preserve `mtime`: in a CI checkout every file is born with the same
# instant. The two blow up to the repository total, or zero out, depending on
# order — and in both cases the number measures nothing. They are a measure of
# the working tree of whoever edits.
#
# What DOES hold in CI is the other half, and it is the one that matters most:
# a dead path, a command with no target and git drift are properties of the
# document's CONTENT against the repository's CONTENT, and they survive any clone.
#
# That is why this job uses `--so` to name what it checks. If your version of
# loadline does not have that flag, let the job run everything and IGNORE in
# writing the red of the two age probes — never re-seal them to the CI value,
# because that writes into the document a number that only exists inside an
# ephemeral checkout.

name: handoff-que-mede-o-disco

on:
  pull_request:
    paths:
      - "CONTINUAR.md"
      - "HANDOFF.md"
      - "RETOMAR.md"
      - "CONTEXT.md"
      - "STATE.md"
  schedule:
    # A handoff never ages by a commit TO IT — it ages by a commit to everything
    # else. No event on this file fires, and that is why the cron here is weekly
    # and not monthly.
    - cron: "0 7 * * 1"
  workflow_dispatch:

jobs:
  aferir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history: `handoff.commits_desde` counts commits, and a
          # shallow checkout would return a smaller number with no error at all —
          # which is the family of defect this project exists to forbid.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: install loadline
        run: |
          git clone --depth 1 https://github.com/marquesPablo/loadline.git /tmp/loadline
          echo "PYTHONPATH=/tmp/loadline" >> "$GITHUB_ENV"

      - name: the handoff document matches the repository
        run: |
          set +e
          python -m loadline . | tee relatorio.txt
          codigo=${PIPESTATUS[0]}
          set -e
          case "$codigo" in
            0) echo "no dead path, no command with no target, and git agrees with the text" ;;
            1)
              echo "::error::the handoff file claims things the disk contradicts"
              echo "::notice::a dead path and a command with no target each have a one-line fix"
              echo "::notice::the AGE probes do not hold in this job — see the header of this file"
              exit 1
              ;;
            2)
              echo "::error::no seal covers the handoff file. Read operacoes/handoff-que-mede-o-disco/selos.md"
              exit 1
              ;;
            *) echo "::error::loadline could not run"; exit 1 ;;
          esac

# ⚠️ A green here does NOT say your handoff is good. It says it does not claim a
#    path that disappeared, a command that lost its target, or a state git
#    contradicts. Whether it tells the right story stays a judgment for whoever
#    wrote it — and no offline probe reaches that.
