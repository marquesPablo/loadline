# Copy to `.github/workflows/vitrine.yml`.
#
# Two steps, in this order, and the order is the point: first the NEGATIVE
# CONTROLS of the `vitrine` itself (each rule seen accusing and staying quiet),
# and only THEN the verdict on your skills. A linter that has not been seen
# accusing its own defect is not trustworthy — it was by running
# `vitrine.controles` that the two real bugs in this tool were found before any
# skill was judged.

name: vitrine

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"

jobs:
  aferir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: install loadline and vitrine
        run: |
          git clone --depth 1 https://github.com/marquesPablo/loadline.git /tmp/loadline
          echo "PYTHONPATH=/tmp/loadline" >> "$GITHUB_ENV"

      - name: trust the linter first — negative controls
        run: python -m vitrine.controles

      - name: only then, judge this repository's skills
        id: aferir
        continue-on-error: true
        run: python -m vitrine .claude/skills

      - name: decide
        run: |
          case "${{ steps.aferir.outcome }}" in
            success) echo "every skill passes the vitrine" ;;
            *) echo "::error::some skill goes invisible to the router — see the report above"; exit 1 ;;
          esac

# ⚠️ Do not swap the two steps. Running `python -m vitrine` without first running
#    `python -m vitrine.controles` judges your skills against a ruler nobody
#    proved is straight.
