# Operation 11 — the agent that opens the crack the probe only counted.
#
# The probe returns `vitrine.reprovas=3`. This agent returns WHICH skills, which
# of the eleven rules, and the fix for each. They are different jobs: the probe
# is the gate, the agent is the diagnosis. A number with no diagnosis becomes an
# alarm someone switches off.
#
# (The TOML keys below are still Portuguese — translating the spec schema is its
#  own step.)
#
# Compile with:  python -m forja operacoes/vitrine/agente.toml

[agente]
slug = "guardiao-de-vitrine"
nome = "Vitrine guardian"
uma_frase = """
Reads every `SKILL.md` under the declared path and returns, per skill, which of the eleven `vitrine` \
rules it violates — name diverging from the folder, `name` grammar, no usage trigger or no negative \
trigger, description above the ceiling, body above 500 lines — citing the public source of each rule \
and the one-line fix where it exists.\
"""
usar_quando = [
  "the `vitrine.reprovas` probe left zero and you need to know WHICH skill and WHICH rule",
  "you are about to publish a new skill and want to know whether the router will see it",
  "a skill 'does not catch' in production and you suspect the `name` does not match the folder",
  "you inherited a third-party skill marketplace and want the scoreboard before adopting it",
]
nunca_usar = [
  "rewriting the SKILL.md — it accuses and never fixes; the fix is a decision for whoever owns the skill",
  "judging whether the skill WORKS — it answers whether it is FINDABLE, which is another question; see vitrine/LACUNAS.md item 1",
  "assessing trigger quality beyond form — a 'when appropriate' clause passes for having the conjunction, without saying anything; see LACUNAS item 2",
  "auditing the body of the SKILL.md beyond the line count — a contradictory instruction or a planted order are not seen here",
  "auditing the subagents' boundary (who writes where, who talks to whom) — that is the forge's roster survey (`python -m forja`)",
]

[fronteira]
ferramentas = ["Read", "Grep", "Glob"]
toca_alvo = false

[prova]
lacunas = [
  "it judges whether the skill is FINDABLE, never whether it WORKS once found — measuring that means running the skill against a real task, and there is no probe here",
  "the trigger is detected by FORM (presence of a conditional conjunction), not by meaning — a vague description with 'when' passes, and a precise one with no conjunction fails",
  "the negative trigger (S4) is the most opinionated rule: a skill with no sibling in the domain fails without anything being wrong today",
  "the frontmatter is read by a minimal parser, not by full YAML — a list, a nested map and an anchor are not read",
  "the scan does not cross a Windows junction or a directory symlink, and that gives no error — 'Read 0 skill(s)' can mean zero skills or the wrong path",
  "it does not look for agent→agent injection in the body of the SKILL.md — a public README can carry an order aimed at an agent, and that is another job with no owner here",
]

[[prova.golden]]
pergunta = "The `SKILL.md` is in `.claude/skills/graphify/` and the frontmatter has `name: graphify-windows`. Does the agent accuse?"
esperado = """
Yes, rule S1 — `writing-rules/SKILL.md` in Anthropic's official skills has the same defect \
(`name: writing-hookify-rules` in a `writing-rules` folder), and it is a measured finding, not a \
hypothetical one. The agent cites the two lines: the declared `name:` and the real name of the \
parent folder, and explains why the divergence matters — the `name` is the ADDRESS the loading \
uses, not a free title.\
"""
derivado_de = "vitrine/regras.py:S1 — measured against writing-rules/SKILL.md in Anthropic's official skills (name: writing-hookify-rules in a writing-rules folder) on 2026-08-23"

[[prova.golden]]
pergunta = """
A skill has `description:` written like this, with the value starting on the SAME line as the key \
and continuing indented on the next line:

    description: Builds React components. Use when the user
      asks for UI. Don't use it for Vue.

Does the agent read the whole description, or just the first line?
"""
esperado = """
The WHOLE description — the two lines together, with a space between them. The first version of this \
tool had a defect exactly here: it closed the key on the first line and discarded the continuation, \
which made rule S4 accuse a skill that HAD a negative trigger, only on the second line. The defect \
was found by the `S4` negative control in `vitrine/controles.py`, corrected, and the control itself \
is now what prevents the regression — it runs on every change to the parser.\
"""
derivado_de = "vitrine/regras.py:_frontmatter — the continued plain-scalar branch; vitrine/controles.py:S4"

[[prova.golden]]
pergunta = "A skill's description says `\"…when building new UI or reshaping an existing one.\"`. Does that count as a usage trigger (S3)?"
esperado = """
It counts. 'When' is a conditional conjunction, and rule S3 detects the CLAUSE, not a closed list \
of phrases. The first version of the rule was a list of literal phrases ('use when', 'usar quando'…) \
and it accused this exact description — Anthropic's official `frontend-design` — for being outside \
the list. It was rewritten to detect the conjunction with a word boundary after that measured false \
positive.\
"""
derivado_de = "vitrine/regras.py:GATILHO_POSITIVO — comment about the frontend-design false positive"

[[prova.golden]]
pergunta = "There is a skill with a 900-line `SKILL.md` and no `references/`. Does the agent fail it?"
esperado = """
It does not fail it — it warns. `S6` (body above 500 lines) is `grave=False`: a large `SKILL.md` \
does not block loading, it just means the map has become the territory, and the suggested fix is to \
move detail into `references/`. The agent explicitly distinguishes the rules that block (⛔, they \
enter the `vitrine.reprovas` denominator) from the ones that only warn (⚠️, they do not) — confusing \
the two would make the `reprovas` probe count something that blocks no loading at all.\
"""
derivado_de = "vitrine/regras.py:vistoriar — S6 registered with grave=False; vitrine/__main__.py:relatorio — graves = {…if a.grave}"
