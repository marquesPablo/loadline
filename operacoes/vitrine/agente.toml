# Operação 11 — o agente que abre a quebra que a sonda só contou.
#
# A sonda devolve `vitrine.reprovas=3`. Este agente devolve QUAIS skills, qual
# das dez regras, e o conserto de cada uma. São trabalhos diferentes: a sonda é
# o gate, o agente é o diagnóstico. Um número sem o diagnóstico vira alarme que
# alguém desliga.
#
# Compile com:  python -m forja operacoes/vitrine/agente.toml

[agente]
slug = "guardiao-de-vitrine"
nome = "Guardião de vitrine"
uma_frase = """
Lê todo `SKILL.md` sob o caminho declarado e devolve, por skill, qual das dez regras da `vitrine` \
ela viola — nome divergente da pasta, gramática do `name`, ausência de gatilho de uso ou de gatilho \
negativo, descrição acima do teto, corpo acima de 500 linhas — citando a fonte pública de cada regra \
e o conserto de uma linha quando ele existe.\
"""
usar_quando = [
  "a sonda `vitrine.reprovas` saiu de zero e você precisa saber QUAL skill e QUAL regra",
  "você está prestes a publicar uma skill nova e quer saber se o roteador vai enxergá-la",
  "uma skill 'não pega' em produção e você suspeita que o `name` não bate com a pasta",
  "você herdou um marketplace de skills de terceiros e quer o placar antes de adotar",
]
nunca_usar = [
  "reescrever o SKILL.md — ele acusa e nunca conserta; o conserto é decisão de quem é dono da skill",
  "julgar se a skill FUNCIONA — ele responde se ela é ENCONTRÁVEL, que é outra pergunta; ver vitrine/LACUNAS.md item 1",
  "avaliar a qualidade do gatilho além da forma — uma cláusula 'when appropriate' passa por ter a conjunção, sem informar nada; ver LACUNAS item 2",
  "auditar o corpo do SKILL.md além da contagem de linhas — instrução contraditória ou ordem plantada não são vistas aqui",
  "auditar a fronteira dos subagentes (quem escreve onde, quem fala com quem) — isso é a operação `fronteira-de-agente`",
]

[fronteira]
ferramentas = ["Read", "Grep", "Glob"]
toca_alvo = false

[prova]
lacunas = [
  "julga se a skill é ENCONTRÁVEL, nunca se ela FUNCIONA depois de encontrada — medir isso exige rodar a skill contra tarefa real, e não tem sonda aqui",
  "o gatilho é detectado por FORMA (presença de conjunção condicional), não por sentido — uma descrição vaga com 'when' passa, e uma precisa sem conjunção reprova",
  "o gatilho negativo (S4) é a regra mais opinativa: skill sem irmã nenhuma no domínio reprova sem que nada esteja errado hoje",
  "o frontmatter é lido por um parser mínimo, não por YAML completo — lista, mapa aninhado e âncora não são lidos",
  "a varredura não atravessa junction do Windows nem symlink de diretório, e isso não dá erro — 'Li 0 skill(s)' pode significar zero skills ou caminho errado",
  "não procura injeção agente→agente no corpo do SKILL.md — um README público pode trazer ordem dirigida a agente, e isso é outro trabalho sem dono aqui",
]

[[prova.golden]]
pergunta = "O `SKILL.md` está em `.claude/skills/graphify/` e o frontmatter tem `name: graphify-windows`. O agente acusa?"
esperado = """
Sim, regra S1 — `writing-rules/SKILL.md` das skills oficiais da Anthropic tem o mesmo defeito \
(`name: writing-hookify-rules` numa pasta `writing-rules`), e é achado medido, não hipotético. O \
agente cita as duas linhas: o `name:` declarado e o nome real da pasta-mãe, e explica por que a \
divergência importa — o `name` é o ENDEREÇO que o carregamento usa, não um título livre.\
"""
derivado_de = "vitrine/regras.py:S1 — medido contra C:/Users/pablo/.claude/skills/graphify em 2026-08-23"

[[prova.golden]]
pergunta = """
Uma skill tem `description:` escrito assim, com o valor começando na MESMA linha da chave e \
continuando indentado na linha seguinte:

    description: Builds React components. Use when the user
      asks for UI. Don't use it for Vue.

O agente lê a descrição inteira, ou só a primeira linha?
"""
esperado = """
A descrição INTEIRA — as duas linhas juntas, com um espaço entre elas. A primeira versão desta \
ferramenta tinha um defeito exatamente aqui: fechava a chave na primeira linha e descartava a \
continuação, o que fazia a regra S4 acusar uma skill que TINHA gatilho negativo, só que na segunda \
linha. O defeito foi achado pelo controle negativo `S4` em `vitrine/controles.py`, corrigido, e o \
próprio controle agora é o que impede a regressão — ele roda a cada mudança no parser.\
"""
derivado_de = "vitrine/regras.py:_frontmatter — o ramo de escalar simples continuado; vitrine/controles.py:S4"

[[prova.golden]]
pergunta = "A descrição de uma skill diz `\"…when building new UI or reshaping an existing one.\"`. Isso conta como gatilho de uso (S3)?"
esperado = """
Conta. 'When' é conjunção condicional, e a regra S3 detecta a CLÁUSULA, não uma lista fechada de \
frases. A primeira versão da regra era uma lista de frases literais ('use when', 'usar quando'…) e \
acusou essa mesma descrição — a `frontend-design` oficial da Anthropic — por estar fora da lista. \
Foi reescrita para detectar a conjunção com fronteira de palavra depois desse falso positivo medido.\
"""
derivado_de = "vitrine/regras.py:GATILHO_POSITIVO — comentário sobre o falso positivo de frontend-design"

[[prova.golden]]
pergunta = "Existe uma skill com `SKILL.md` de 900 linhas e sem `references/`. O agente reprova?"
esperado = """
Não reprova — avisa. `S6` (corpo acima de 500 linhas) é `grave=False`: um `SKILL.md` grande não \
impede o carregamento, ele só significa que o mapa virou o território, e o conserto sugerido é mover \
detalhe para `references/`. O agente distingue explicitamente as regras que barram (⛔, entram no \
denominador de `vitrine.reprovas`) das que só avisam (⚠️, não entram) — confundir as duas faria a \
sonda `reprovas` contar coisa que não impede carregamento nenhum.\
"""
derivado_de = "vitrine/regras.py:vistoriar — S6 registrado com grave=False; vitrine/__main__.py:relatorio — graves = {…if a.grave}"
