# Copy to `.github/workflows/readme.yml`.
#
# This job comments on the pull request instead of failing. It is deliberate:
# the first week of adoption cannot be a red wall, or the team's answer is to
# switch the job off — and a switched-off gate is worse than a missing one,
# because someone still thinks it is there.
#
# When the team is ready, swap `continue-on-error: true` for `false` and seal
# the decision, with an owner and with `breaks=`. The seal ready to copy is in
# `selos.md`, in the «The deadline is a choice» section.

name: readme-que-nao-mente

on:
  pull_request:
    paths: ["**/*.md"]
  schedule:
    # `expires=` only bites if someone runs. Without this line, a number that
    # aged waits for the next PR that touches a `.md` — and the most forgotten
    # text is exactly the one nobody touches.
    - cron: "0 6 1 * *"

jobs:
  aferir:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # `repo.commits` and `repo.contribuidores` read the history

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: install loadline
        run: |
          git clone --depth 1 https://github.com/marquesPablo/loadline.git /tmp/loadline
          echo "PYTHONPATH=/tmp/loadline" >> "$GITHUB_ENV"

      - name: check what the documentation claims
        id: aferir
        continue-on-error: true
        run: |
          python -m loadline . | tee relatorio.txt
          echo "codigo=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: comment on the PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const corpo = fs.readFileSync('relatorio.txt', 'utf8');
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '### loadline\n\n```\n' + corpo.slice(0, 60000) + '\n```',
            });

      - name: decide
        run: |
          case "${{ steps.aferir.outputs.codigo }}" in
            0) echo "everything checked and within the deadline" ;;
            1) echo "::warning::something written no longer matches — see the PR comment" ;;
            2) echo "::warning::there is a claim no seal covers — run \`python -m loadline . --selar\`" ;;
            *) echo "::error::loadline could not run"; exit 1 ;;
          esac
