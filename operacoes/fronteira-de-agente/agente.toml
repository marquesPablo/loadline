# Operação 3 — o agente que abre cada reprovação que a sonda só contou.
#
# `agentes.reprovariam_na_forja=5` é um alarme. Cinco QUAIS, falhando QUAL regra,
# e a linha de conserto de cada um — isso é trabalho. Um alarme sem o segundo é
# um alarme que alguém desliga.
#
# Compile com:  python -m forja operacoes/fronteira-de-agente/agente.toml

[agente]
slug = "auditor-de-fronteira"
nome = "Auditor de fronteira"
uma_frase = """
Lê os subagentes que você escreveu à mão e o arquivo de configuração que registra os hooks, cruza os \
dois, e devolve — com arquivo e linha — cada agente que pede rede, escrita ou shell sem que nenhuma \
barreira registrada o cubra, mais a linha de conserto que faltaria para ele passar na forja.\
"""
usar_quando = [
  "o repositório tem subagentes escritos à mão e ninguém sabe quais têm fronteira declarada",
  "a sonda `agentes.reprovariam_na_forja` saiu de zero e você precisa saber quais",
  "antes de aceitar um PR que acrescenta subagente, para ver o que ele pede e o que o cerca",
  "você vai migrar agentes escritos à mão para specs compiladas e precisa saber o tamanho do buraco",
]
nunca_usar = [
  "editar o agente, o settings.json ou o hook — ele acusa e nunca conserta; conceder poder é decisão de quem é dono do repositório",
  "afirmar que um hook FUNCIONA; ele vê que o hook está registrado, e se ele nega de verdade só se prova rodando o hook contra um evento",
  "julgar se o agente deveria existir, ou se o poder que ele pede é demais para a tarefa — isso é menor privilégio, e é julgamento humano",
  "auditar arquivo de instrução (AGENTS.md, CLAUDE.md) — isso é a operação `instrucao-que-nao-mente`",
  "revisar o prompt do agente em busca de injeção — é outra família de defeito e exige outro método",
]

[fronteira]
ferramentas = ["Read", "Grep", "Glob"]
toca_alvo = false

[prova]
lacunas = [
  "mede fronteira DECLARADA, nunca segurança: um hook registrado pode estar quebrado ou liberar tudo, e ele não roda o hook para descobrir",
  "não enxerga R4 a R8 da forja — lacunas, golden set, autorização e slug moram na spec, e não sobrevivem no artefato compilado",
  "não conhece hook registrado fora de `.claude/settings*.json`; um harness que registre barreira noutro lugar passa como se não tivesse nenhuma",
  "trata `tools: *` como ausência de declaração, e um agente que herda tudo some das contagens por classe de poder",
  "não lê `permissions` nem allowlist de comando — um Bash cercado só por allowlist de comando é contado como sem cerca",
  "não julga se o matcher do hook casa com o que ele deveria casar; `WebFetch` no matcher é lido como cobertura de `WebFetch`, e um regex errado passaria",
]

[[prova.golden]]
pergunta = "Um agente declara `tools: Read, Grep, WebFetch, WebSearch, Write` e o repositório não tem `.claude/settings.json`. Quantas regras ele falha?"
esperado = """
Duas, no mínimo — R1 e R2. R1 porque pede rede e nenhum PreToolUse registrado a cobre; R2 porque \
pede escrita e nenhum PreToolUse registrado a cobre. Se a descrição dele também não disser em que \
caso NÃO usá-lo, falha R3 junto. Ele conta UMA vez em `agentes.reprovariam_na_forja` e três vezes \
nas sondas específicas, e o agente explica a diferença em vez de deixar os números brigarem.\
"""
derivado_de = "operacoes/fronteira-de-agente/sondas.py:reprovariam_na_forja — o `if r1 or r2 or r3`"

[[prova.golden]]
pergunta = "Um agente declara `tools: Read, Grep, Glob` e a descrição diz «NUNCA usar para escrever código novo». Ele reprova?"
esperado = """
Não. Não pede rede, não pede escrita, não pede shell — R1 e R2 não se aplicam —, e a descrição \
carrega anti-descrição, o que satisfaz R3. Ele é o caso em que a resposta certa é verde, e ela \
importa: uma régua que reprova todo mundo é indistinguível de uma régua quebrada, e a primeira \
coisa que se faz com ela é desligá-la.\
"""
derivado_de = "operacoes/fronteira-de-agente/sondas.py:_FRONT_ANTI — o vocabulário da anti-descrição"

[[prova.golden]]
pergunta = "Existe um `PreToolUse` com `matcher: \"*\"` e um comando. Isso cerca os agentes com WebFetch?"
esperado = """
Pela medida desta operação, sim: um matcher curinga com comando é lido como cobertura de todas as \
ferramentas do vocabulário fechado. E o agente diz, na mesma frase, que isso é DECLARAÇÃO e não \
prova — um hook que casa tudo e libera tudo daria exatamente o mesmo número. A pergunta «ele nega \
de verdade?» só se responde rodando o hook contra um evento, e isso está fora desta operação.\
"""
derivado_de = "operacoes/fronteira-de-agente/sondas.py:_front_matchers_de_hook — o ramo `matcher in (\"*\", \"\")`"

[[prova.golden]]
pergunta = "Sete ferramentas com nome `mcp__servidor__x` aparecem nos agentes. É defeito?"
esperado = """
Não é defeito, e é exibido de propósito. São nomes fora do vocabulário fechado — ferramentas MCP, \
neste caso —, e o número existe porque tratar nome desconhecido como inofensivo é como uma cerca \
deixa de cercar sem ninguém ver. A sonda é de `natureza=relacao`: se esse número mudar sem alguém \
ter acrescentado ferramenta, alguma coisa quebrou na leitura.\
"""
derivado_de = "operacoes/fronteira-de-agente/sondas.py:_FRONT_CONHECIDAS — o vocabulário fechado"
