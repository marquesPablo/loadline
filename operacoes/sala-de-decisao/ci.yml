# Copy to `.github/workflows/sala-de-decisao.yml`.
#
# This job has a trigger the others on the shelf do not: a DAILY `schedule`.
# And the reason is the nature of what it measures.
#
# A stuck item waiting on a decision fires no event. There is no commit, no PR,
# no diff — the file is there, identical, and it keeps getting old. Every other
# job on this shelf measures things that change when someone writes; this one
# measures a thing that gets worse when NOBODY writes.
#
# A weekly cron would already be better than nothing. Daily is what makes the
# queue get seen before someone needs it.

name: sala-de-decisao

on:
  pull_request:
    paths:
      - "decisoes/**"
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

jobs:
  aferir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: install loadline
        run: |
          git clone --depth 1 https://github.com/marquesPablo/loadline.git /tmp/loadline
          echo "PYTHONPATH=/tmp/loadline" >> "$GITHUB_ENV"

      - name: check the archive's integrity
        run: |
          set +e
          python -m loadline . | tee relatorio.txt
          codigo=${PIPESTATUS[0]}
          set -e
          case "$codigo" in
            0) echo "archive intact: every status declared, every revocation with a back-pointer" ;;
            1)
              echo "::error::the decision archive diverged from what is written about it"
              echo "::notice::a relation diverging = STOP and investigate. a count = read the number, then re-seal."
              exit 1
              ;;
            2)
              echo "::error::no seal covers the decisions index. Read operacoes/sala-de-decisao/selos.md"
              exit 1
              ;;
            *) echo "::error::loadline could not run"; exit 1 ;;
          esac

      # The queue is information, not a defect — and so it WARNS without failing.
      # A job that fails because someone has not decided yet trains the team to
      # close a gate under pressure so CI goes green, which is the opposite of
      # what the queue is for.
      - name: say what is waiting on someone
        if: always()
        run: |
          set -e
          python - <<'PY'
          import importlib.util, os, sys
          sys.path.insert(0, os.environ.get("PYTHONPATH", ""))
          from loadline import registro
          spec = importlib.util.spec_from_file_location("sondas", "sondas.py")
          modulo = importlib.util.module_from_spec(spec); spec.loader.exec_module(modulo)
          try:
              abertos = registro.medir("decisao.gates_abertos", None)
              dias = registro.medir("decisao.gate_mais_velho_dias", None)
          except LookupError as exc:
              print(f"::warning::could not read the queue: {exc}")
              raise SystemExit(0)
          if abertos:
              print(f"::warning::{abertos} item(s) waiting on a decision. The oldest for {dias} day(s).")
          else:
              print("nothing waiting on a decision.")
          PY

# ⚠️ This job does NOT say the decisions are being followed, nor that they were
#    good. It says the archive is intact — status declared, alternative written,
#    revocation warned on both sides — and it says out loud what is stuck.
