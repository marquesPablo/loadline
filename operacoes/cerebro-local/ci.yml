# Copy to `.github/workflows/cerebro-local.yml`.
#
# This job has two halves, and the second is the one that matters. The first
# checks the vault's seals. The second RUNS THE SERVER and proves it still does
# what the documentation says — including that it REFUSES a path outside the root.
#
# A file server whose refusal is never exercised is a server whose refusal you
# find broken the day someone tests it for you.

name: cerebro-local

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # A broken link comes from a rename and does not warn; an orphan comes from
    # a new note nobody has cited yet. Neither fires a commit event on its own —
    # it is the `expires=` that catches it, and it only bites if someone runs.
    - cron: "0 6 * * 1"

jobs:
  aferir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: install loadline
        run: |
          git clone --depth 1 https://github.com/marquesPablo/loadline.git /tmp/loadline
          echo "PYTHONPATH=/tmp/loadline" >> "$GITHUB_ENV"

      - name: check the vault's seals
        run: |
          set +e
          python -m loadline . | tee relatorio.txt
          codigo=${PIPESTATUS[0]}
          set -e
          case "$codigo" in
            0) echo "corpus intact: no edge to the void, and the server is what is written" ;;
            1)
              echo "::error::something checked does not match — read the nature of each line before re-sealing"
              echo "::notice::a count diverging = you wrote. a relation diverging = STOP and investigate."
              exit 1
              ;;
            2)
              echo "::error::no seal covers the vault. Read cerebro/selos.md"
              exit 1
              ;;
            *) echo "::error::loadline could not run"; exit 1 ;;
          esac

      # The half that matters: the server has to RUN, and it has to REFUSE.
      - name: the server starts, answers and refuses
        run: |
          set -e
          saida=$(python cerebro/servidor.py --root . --test)
          echo "$saida"

          echo "$saida" | grep -q "REFUSED, as it must" || {
            echo "::error::the server did NOT refuse a path outside the root."
            echo "::error::This is not a detail: it is a notes reader that reads the whole disk."
            exit 1
          }

          # The protocol handshake, with the server as a real subprocess.
          # In-process logic passes and the protocol hangs — it has cost more
          # than one project dearly, and the symptom shows up far from the cause.
          resposta=$(printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            | python cerebro/servidor.py --root . )
          echo "$resposta" | grep -q '"tools"' || {
            echo "::error::the server did not answer tools/list over the protocol"
            exit 1
          }
          echo "server: starts, answers the handshake, lists the tools and refuses outside the root"

# ⚠️ This job does NOT say your notes are right. It says the corpus is well
#    linked, that the server is what the documentation promises, and that the
#    path refusal is still closed. Content is a judgment for whoever wrote it.
