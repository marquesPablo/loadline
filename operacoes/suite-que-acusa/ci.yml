# Copy to `.github/workflows/suite-que-acusa.yml`.
#
# ⚠️ THIS JOB HAS TWO HALVES ON PURPOSE, AND MIXING THEM RUINS BOTH.
#
#   1. What FAILS: `suite.sem_assercao`. It is a verdict — a test function with
#      no assertion cannot fail, and that is a property of the code, not opinion.
#
#   2. What WARNS and never fails: `suite.sem_controle_negativo`. It is a
#      declared heuristic, and it gets it wrong both ways. A heuristic rule that
#      fails trains the team to write a test to please the rule — and then it
#      stops measuring the code and starts measuring itself.
#
# If you turn the second one on as a failure, you have built exactly the defect
# this operation exists to find: a green suite that proves nothing.

name: suite-que-acusa

on:
  pull_request:
    paths:
      - "tests/**"
      - "LACUNAS.md"
  schedule:
    # A gap list ages in a particular way: the gaps CLOSE without anyone
    # deleting the line. The check that was missing was written and the list
    # still declares the hole. No commit fires this — it is `expires=` that catches it.
    - cron: "0 6 1 * *"

jobs:
  aferir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: install loadline
        run: |
          git clone --depth 1 https://github.com/marquesPablo/loadline.git /tmp/loadline
          echo "PYTHONPATH=/tmp/loadline" >> "$GITHUB_ENV"

      - name: what fails — a test that cannot fail, and the third list
        run: |
          set +e
          python -m loadline . | tee relatorio.txt
          codigo=${PIPESTATUS[0]}
          set -e
          case "$codigo" in
            0) echo "no test function with no assertion, and the third list is within the deadline" ;;
            1)
              echo "::error::there is a test function that cannot fail, or the third list expired"
              echo "::notice::a test function with no assert runs, returns green and verifies nothing"
              exit 1
              ;;
            2)
              echo "::error::no seal covers the suite. Read operacoes/suite-que-acusa/selos.md"
              exit 1
              ;;
            *) echo "::error::loadline could not run"; exit 1 ;;
          esac

      # The half that WARNS. It never comes out non-zero — it is a `warning`, by
      # decision, and the decision is explained in the header of this file.
      - name: what warns — tests with no apparent negative control
        if: always()
        run: |
          set -e
          python - <<'PY'
          import importlib.util, os, sys
          sys.path.insert(0, os.environ.get("PYTHONPATH", ""))
          from loadline import registro
          spec = importlib.util.spec_from_file_location("sondas", "sondas.py")
          modulo = importlib.util.module_from_spec(spec); spec.loader.exec_module(modulo)
          try:
              sem = registro.medir("suite.sem_controle_negativo", None)
              total = registro.medir("suite.checks", None)
              pulados = registro.medir("suite.pulados", None)
          except LookupError as exc:
              print(f"::warning::could not read the suite: {exc}")
              raise SystemExit(0)
          if sem:
              print(f"::warning::{sem} of {total} tests with no APPARENT negative control.")
              print("::warning::Heuristic: gets it wrong both ways. It is a reading list, not a verdict.")
          if pulados:
              print(f"::warning::{pulados} skipped test(s) — they count in the list and measure nothing.")
          PY

# ⚠️ A green here does NOT say your suite would catch a real bug. It says no
#    test is a function that cannot fail, and that the suite's limits are
#    written and within the deadline. It is far less than it seems — and it is
#    far more than a common green suite says.
