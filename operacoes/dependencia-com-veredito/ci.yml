# Copie para `.github/workflows/dependencias.yml`.
#
# O gatilho deste job é o que o torna útil: ele roda quando o MANIFESTO muda,
# não quando a documentação muda. É a inversão que a operação inteira propõe —
# a dependência entra pelo manifesto, e é aí que alguém tem de olhar, não numa
# revisão trimestral que já vai encontrar tudo pronto e aprovado.

name: dependencia-com-veredito

on:
  pull_request:
    paths:
      - "package.json"
      - "pyproject.toml"
      - "requirements.txt"
      - "go.mod"
      - "licencas.md"      # troque pelo caminho da SUA tabela
  schedule:
    # Um veredito não envelhece por commit: ele envelhece por relicenciamento
    # lá fora, que nenhum evento deste repositório dispara. É o `vence=` que
    # pega isso, e ele só morde se alguém rodar.
    - cron: "0 6 1 * *"

jobs:
  aferir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: instalar o aferido
        run: |
          git clone --depth 1 https://github.com/SEU-USUARIO/aferido.git /tmp/aferido
          echo "PYTHONPATH=/tmp/aferido" >> "$GITHUB_ENV"

      - name: conferir se toda dependência tem veredito
        run: |
          set +e
          python -m aferido . | tee relatorio.txt
          codigo=${PIPESTATUS[0]}
          set -e
          case "$codigo" in
            0) echo "toda dependência declarada tem veredito, e nenhum veredito ficou órfão" ;;
            1)
              echo "::error::entrou dependência sem veredito de licença, ou um veredito ficou para trás"
              echo "::notice::abra a página do repositório da dependência e escreva a linha em licencas.md"
              exit 1
              ;;
            2)
              echo "::error::nenhum selo cobre a tabela de licenças. Leia operacoes/dependencia-com-veredito/selos.md"
              exit 1
              ;;
            *) echo "::error::o aferido não pôde rodar"; exit 1 ;;
          esac

# ⚠️ Este job NÃO lê licença. Ele mede a distância entre o manifesto e a tabela
#    que um humano escreveu. Um verde aqui significa "alguém olhou cada uma
#    delas até a data do selo" — nunca "as licenças estão em ordem".
