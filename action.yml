name: loadline
description: >-
  forja (the agent roster survey), placar (the seven gates) and loadline
  (claim × seal) run against the adopter's repository. Zero Docker, zero
  external service, zero API key, zero infrastructure of its own — only the
  Python stdlib, on the caller's runner.
author: marquesPablo
branding:
  icon: shield
  color: gray-dark

inputs:
  caminho:
    description: 'Folder to scan, relative to the root of the repository calling this Action.'
    required: false
    default: '.'
  falhar-em:
    description: >-
      Which tools should break the job when they accuse something: a
      comma-separated combination of "forja,placar,loadline", or "nenhuma" to
      only report. Default "nenhuma" — the first run is a diagnosis, not a gate;
      the adopter turns the gate on when they decide it is ready.
    required: false
    default: 'nenhuma'
  html:
    description: 'If "true", each tool also writes a self-contained HTML report (loadline-<tool>.html), published as a job artifact.'
    required: false
    default: 'false'

outputs:
  codigo-forja:
    description: 'Exit code of the forja survey (0 pass · 1 fail · 2 refused).'
    value: ${{ steps.forja.outputs.codigo }}
  codigo-placar:
    description: 'Exit code of placar (0 seven of seven · 1 some gate fails · 2 no harness).'
    value: ${{ steps.placar.outputs.codigo }}
  codigo-loadline:
    description: 'Exit code of loadline (0 all green · 1 fail · 2 no denominator).'
    value: ${{ steps.loadline.outputs.codigo }}

runs:
  using: composite
  steps:
    - name: python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: forja — the agent roster survey
      id: forja
      shell: bash
      run: |
        set +e
        if [ "${{ inputs.html }}" = "true" ]; then
          PYTHONPATH="${{ github.action_path }}" python -m forja "${{ inputs.caminho }}" --html loadline-forja.html
        else
          PYTHONPATH="${{ github.action_path }}" python -m forja "${{ inputs.caminho }}"
        fi
        echo "codigo=$?" >> "$GITHUB_OUTPUT"

    - name: placar — the seven gates
      id: placar
      shell: bash
      run: |
        set +e
        if [ "${{ inputs.html }}" = "true" ]; then
          PYTHONPATH="${{ github.action_path }}" python -m placar "${{ inputs.caminho }}" --html loadline-placar.html
        else
          PYTHONPATH="${{ github.action_path }}" python -m placar "${{ inputs.caminho }}"
        fi
        echo "codigo=$?" >> "$GITHUB_OUTPUT"

    - name: loadline — claim × seal
      id: loadline
      shell: bash
      run: |
        set +e
        if [ "${{ inputs.html }}" = "true" ]; then
          PYTHONPATH="${{ github.action_path }}" python -m loadline "${{ inputs.caminho }}" --html loadline-loadline.html
        else
          PYTHONPATH="${{ github.action_path }}" python -m loadline "${{ inputs.caminho }}"
        fi
        echo "codigo=$?" >> "$GITHUB_OUTPUT"

    - name: HTML reports as a job artifact
      if: ${{ inputs.html == 'true' }}
      uses: actions/upload-artifact@v4
      with:
        name: loadline-report
        path: loadline-*.html
        if-no-files-found: warn

    - name: apply the gate declared in `falhar-em`
      shell: bash
      run: |
        python "${{ github.action_path }}/acao/gate.py" "${{ inputs.falhar-em }}" \
          "${{ steps.forja.outputs.codigo }}" \
          "${{ steps.placar.outputs.codigo }}" \
          "${{ steps.loadline.outputs.codigo }}"
