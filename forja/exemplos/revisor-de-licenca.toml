# A forge example spec — and it is real, not a toy.
#
# This agent answers the question the Census measured as the most expensive in
# the ecosystem: "can I use this repository in my open-source project?". It
# exists because `CC BY-NC` and `AGPL-3.0` are the two licenses most often
# described as "open source" by people who only read the README.
#
# (The TOML keys below are still Portuguese — translating the spec schema is its
#  own step, like the seal vocabulary was.)
#
# Compile with:  python -m forja forja/exemplos/revisor-de-licenca.toml

[agente]
slug = "revisor-de-licenca"
nome = "License reviewer"
uma_frase = """
Answers whether a dependency can go into an open-source project, citing the license read \
on the repository's PAGE — and separates the three doors almost everyone treats as one: \
running it, reading the architecture as a specification, and copying the code in.\
"""
usar_quando = [
  "you are about to add a dependency and want to know what it obliges",
  "someone said a repository is open source and you want to check",
  "you need to decide between vendoring the code and reimplementing the architecture",
]
nunca_usar = [
  "choosing the license of YOUR project — that is an owner's decision, not an analysis",
  "giving legal advice; this reads a declared identifier, it does not replace a lawyer",
  "reviewing code for vulnerabilities — that is another agent",
  "judging a patent, trademark or contract — nothing here looks at that",
]

[fronteira]
ferramentas = ["Read", "Grep", "Glob", "WebFetch"]
dominios_permitidos = [
  "github.com",
  "raw.githubusercontent.com",
  "api.github.com",
  "opensource.org",
  "spdx.org",
  "gitlab.com",
]
toca_alvo = false

[prova]
lacunas = [
  "does not read the full license text — it reads the identifier declared in the repository, and a hand-edited LICENSE contradicts the identifier",
  "does not know whether the repository relicensed after the date the page was read",
  "does not see a transitive dependency's license; an MIT that pulls an AGPL still pulls an AGPL",
  "does not tell dual-licensing (open code + paid commercial license) apart when the repository does not declare it on the main page",
  "does not judge whether YOUR project is commercial — that is the question that decides the `NC` case, and it is yours",
]

# What this agent needs to already exist out there. The forge opens the Census
# and returns the REAL components for each stage, with license and collision
# warning, instead of recommending off the top of its head.
[censo]
precisa = ["ontologia", "controle", "memoria"]

[[prova.golden]]
pergunta = "Can PANO (ALW1EZ/PANO) be copied into an MIT project?"
esperado = """
No. The license is CC BY-NC, which is not OSI-approved and is incompatible with MIT. \
The other two doors stay open: running the tool is allowed, and reading the entity/transform \
catalog as a specification and reimplementing it too.\
"""
derivado_de = "censo/ecossistema.json:projetos[PANO].veredito_licenca"

[[prova.golden]]
pergunta = "Is repowise OSI? Can I use it with no consequence in a closed project?"
esperado = """
It is OSI, and even so the answer to the second question is non-trivial: AGPL-3.0 is strong \
copyleft and reaches network use. The census marks it `osi_copyleft_forte` precisely because \
the two answers diverge, and the repository offers a paid commercial license as a way out.\
"""
derivado_de = "censo/ecossistema.json:projetos[repowise].veredito_licenca"

[[prova.golden]]
pergunta = "How many of the cataloged projects have an OSI license verified on the page?"
esperado = "Seven. Two are explicitly non-OSI and the rest are `nao_verificado` — which never becomes zero."
derivado_de = "censo/CENSO.md § The denominator of this reading"
